name: Temporary presentation diagnostics

on:
  push:
    branches:
      - agent/astra-portable-glibc224

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/astra-portable-glibc224
          fetch-depth: 0

      - name: Add stage logging and gdb fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("src-testing/presentation_test.cpp")
          replace_once(
              test,
              "namespace\n{\n    image::Image make_source_image",
              "namespace\n{\n    void stage(const std::string &name)\n    {\n        std::cerr << \"[presentation-test] \" << name << std::endl;\n    }\n\n    image::Image make_source_image",
          )
          replace_once(
              test,
              "    {\n        image::Image output = image::presentation::render_layout(source, drawer, spec, layout);",
              "    {\n        stage(\"render \" + label);\n        image::Image output = image::presentation::render_layout(source, drawer, spec, layout);\n        stage(\"validate \" + label);",
          )
          replace_once(
              test,
              "        image::save_img(output, path.string());",
              "        stage(\"save \" + label);\n        image::save_img(output, path.string());",
          )
          replace_once(
              test,
              "    image::TextDrawer text_drawer;\n    text_drawer.init_font(argv[1]);",
              "    stage(\"initialize font\");\n    image::TextDrawer text_drawer;\n    text_drawer.init_font(argv[1]);",
          )
          replace_once(
              test,
              "    if (!validate_transform())",
              "    stage(\"validate raster transforms\");\n    if (!validate_transform())",
          )
          replace_once(
              test,
              "    if (!validate_orientation_analysis())",
              "    stage(\"validate north-up analysis\");\n    if (!validate_orientation_analysis())",
          )
          replace_once(
              test,
              "    const image::Image landscape = make_source_image(1280, 620);",
              "    stage(\"create synthetic rasters\");\n    const image::Image landscape = make_source_image(1280, 620);",
          )

          native = Path("scripts/astra/build-native.sh")
          old_block = '''if [[ "${RUN_TESTS}" == "1" && -x "${BUILD_DIR}/satdump-presentation-test" ]]; then
              TEST_OUTPUT="${BUILD_DIR}/presentation-test-output"
              log_info "Smoke-тест плашек и легенд"
              LD_LIBRARY_PATH="${BUILD_DIR}:${BUILD_DIR}/plugins:${LD_LIBRARY_PATH}" \\
                  "${BUILD_DIR}/satdump-presentation-test" \\
                  "${SATDUMP_ROOT}/resources/fonts/Roboto-Medium.ttf" \\
                  "${TEST_OUTPUT}"
              log_ok "Тестовые изображения: ${TEST_OUTPUT}"
          fi'''.replace("          ", "")
          new_block = '''if [[ "${RUN_TESTS}" == "1" && -x "${BUILD_DIR}/satdump-presentation-test" ]]; then
              TEST_OUTPUT="${BUILD_DIR}/presentation-test-output"
              TEST_LIBRARY_PATH="${BUILD_DIR}:${BUILD_DIR}/plugins:${LD_LIBRARY_PATH}"
              TEST_COMMAND=(
                  "${BUILD_DIR}/satdump-presentation-test"
                  "${SATDUMP_ROOT}/resources/fonts/Roboto-Medium.ttf"
                  "${TEST_OUTPUT}"
              )
              log_info "Smoke-тест плашек и легенд"
              set +e
              LD_LIBRARY_PATH="${TEST_LIBRARY_PATH}" "${TEST_COMMAND[@]}"
              TEST_STATUS=$?
              set -e
              if [[ "${TEST_STATUS}" != "0" ]]; then
                  log_error "Presentation smoke-тест завершился с кодом ${TEST_STATUS}."
                  if command_exists gdb; then
                      GDB_LOG="${BUILD_DIR}/presentation-test-gdb.log"
                      log_warn "Повторный запуск под gdb; backtrace: ${GDB_LOG}"
                      set +e
                      env LD_LIBRARY_PATH="${TEST_LIBRARY_PATH}" \\
                          gdb -q -batch \\
                              -ex "set pagination off" \\
                              -ex run \\
                              -ex "thread apply all bt full" \\
                              --args "${TEST_COMMAND[@]}" \\
                          >"${GDB_LOG}" 2>&1
                      set -e
                      cat "${GDB_LOG}" >&2
                  fi
                  exit "${TEST_STATUS}"
              fi
              log_ok "Тестовые изображения: ${TEST_OUTPUT}"
          fi'''.replace("          ", "")
          replace_once(native, old_block, new_block)

          workflow = Path(".github/workflows/presentation-1.2.2.yml")
          replace_once(
              workflow,
              "            libnng-dev\n",
              "            libnng-dev \\\n            gdb\n",
          )
          replace_once(
              workflow,
              "            build/astra-${{ matrix.astra }}-ci/native-version.log\n",
              "            build/astra-${{ matrix.astra }}-ci/native-version.log\n            build/astra-${{ matrix.astra }}-ci/presentation-test-gdb.log\n",
          )
          PY

          rm .github/workflows/presentation-diagnostics-temp.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-testing/presentation_test.cpp \
            scripts/astra/build-native.sh \
            .github/workflows/presentation-1.2.2.yml \
            .github/workflows/presentation-diagnostics-temp.yml
          git commit -m "Диагностировать падение presentation smoke-теста"
          git push origin HEAD:agent/astra-portable-glibc224
