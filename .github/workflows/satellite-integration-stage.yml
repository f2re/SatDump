name: Satellite integration staging
on:
  push:
    branches: [integration/satellite-web-20260910]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Export baseline sources for integration tests
        run: |
          git archive --format=tar.gz --output=/tmp/satellite-baseline.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: satellite-complete-baseline
          path: /tmp/satellite-baseline.tar.gz
          retention-days: 3
