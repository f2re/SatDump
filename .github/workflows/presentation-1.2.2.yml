name: SatDump 1.2.2 Presentation CI

on:
  push:
    branches:
      - release/1.2.2
      - feature/1.2.2-presentation
      - feature/presentation-semantic-legends-1.2.2
  pull_request:
    branches:
      - release/1.2.2
  workflow_dispatch:
    inputs:
      run_astra_ubi17:
        description: "Дополнительно проверить официальный Astra Linux UBI 1.7"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: presentation-1.2.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-and-docs:
    name: Astra scripts, semantic audit and documentation
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Bash syntax
        run: |
          find scripts/astra -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/presentation/audit_composites.py

      - name: ShellCheck
        shell: bash
        run: |
          set +e
          shellcheck \
            --external-sources \
            --exclude=SC1091,SC2034,SC2015 \
            scripts/astra/*.sh \
            > presentation-shellcheck.log 2>&1
          status=$?
          cat presentation-shellcheck.log
          exit "${status}"

      - name: Upload ShellCheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-shellcheck-log
          path: presentation-shellcheck.log
          if-no-files-found: warn
          retention-days: 7

      - name: Check documentation entry points
        run: |
          test -s README.md
          test -s docs/ru/README.md
          test -s docs/ru/INSTALL_ASTRA.md
          test -s docs/ru/BUILD.md
          test -s docs/ru/PORTABLE_ASTRA.md
          test -s docs/ru/RUN.md
          test -s docs/ru/CONFIGURATION.md
          test -s docs/ru/PRESENTATION.md
          test -s docs/ru/PRESENTATION_SEMANTICS.md
          test -s docs/ru/PRESENTATION_LAYOUTS.md
          test -s docs/ru/ASTRA_VALIDATION.md
          test -s docs/ru/DEPLOYMENT.md
          test -s docs/ru/TROUBLESHOOTING.md
          test -s resources/presentation/composite_profiles_ru.json

      - name: Audit every configured composite and handler
        run: |
          mkdir -p build/presentation-audit
          python3 scripts/presentation/audit_composites.py \
            --config satdump_cfg.json \
            --profiles resources/presentation/composite_profiles_ru.json \
            --resources-root resources \
            --output build/presentation-audit/composites.md \
            --json-output build/presentation-audit/composites.json \
            --strict
          head -n 80 build/presentation-audit/composites.md

      - name: Upload full composite semantic audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-composite-semantic-audit
          path: build/presentation-audit/
          if-no-files-found: error
          retention-days: 14

  astra-compatibility:
    name: Astra ${{ matrix.astra }} compatible headless build
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        astra: ["1.6", "1.7"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise native dependency installer
        env:
          ASTRA_VERSION_OVERRIDE: ${{ matrix.astra }}
        shell: bash
        run: |
          bash scripts/astra/install-deps.sh \
            --profile headless \
            --no-update \
            --dry-run

      - name: Install required dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libfftw3-dev \
            libpng-dev \
            libtiff-dev \
            libjemalloc-dev \
            libcurl4-openssl-dev \
            libnng-dev

          if ! sudo apt-get install -y libvolk2-dev; then
            sudo apt-get install -y libvolk-dev
          fi

      - name: Build and install Astra-compatible headless profile
        env:
          ASTRA_VERSION_OVERRIDE: ${{ matrix.astra }}
        shell: bash
        run: |
          build_dir="${GITHUB_WORKSPACE}/build/astra-${{ matrix.astra }}-ci"
          install_prefix="${GITHUB_WORKSPACE}/build/satdump-install-astra-${{ matrix.astra }}-ci"
          mkdir -p "${build_dir}"
          set -o pipefail
          bash scripts/astra/build.sh \
            --mode native \
            --profile headless \
            --build-dir "${build_dir}" \
            --prefix "${install_prefix}" \
            --jobs 2 \
            --clean-prefix \
            --install \
            2>&1 | tee "${build_dir}/native-build.log"

      - name: Validate semantic profile engine and render references
        shell: bash
        run: |
          build_dir="${GITHUB_WORKSPACE}/build/astra-${{ matrix.astra }}-ci"
          output="${build_dir}/presentation-test-output"
          mkdir -p "${output}"
          test -x "${build_dir}/satdump-presentation-semantics-test"
          LD_LIBRARY_PATH="${build_dir}:${build_dir}/plugins:${LD_LIBRARY_PATH:-}" \
            "${build_dir}/satdump-presentation-semantics-test" \
            "${GITHUB_WORKSPACE}/resources/presentation/composite_profiles_ru.json" \
            "${GITHUB_WORKSPACE}/resources/fonts/Roboto-Medium.ttf" \
            "${output}"

      - name: Validate installed native tree and launcher
        env:
          ASTRA_VERSION_OVERRIDE: ${{ matrix.astra }}
        shell: bash
        run: |
          prefix="${GITHUB_WORKSPACE}/build/satdump-install-astra-${{ matrix.astra }}-ci"
          test -x "${prefix}/bin/satdump"
          test -d "${prefix}/share/satdump/resources"
          test -d "${prefix}/share/satdump/pipelines"
          test -f "${prefix}/share/satdump/satdump_cfg.json"
          test -f "${prefix}/share/satdump/resources/presentation/composite_profiles_ru.json"
          test -f "${prefix}/.satdump-install-root"
          bash scripts/astra/run.sh \
            --prefix "${prefix}" \
            -- version \
            | tee "build/astra-${{ matrix.astra }}-ci/native-version.log"

      - name: Validate orientation and visual products
        run: |
          output="build/astra-${{ matrix.astra }}-ci/presentation-test-output"
          test -s "${output}/continuous_editorial_landscape.png"
          test -s "${output}/continuous_minimal_landscape.png"
          test -s "${output}/categorical_editorial_landscape.png"
          test -s "${output}/composite_editorial_landscape.png"
          test -s "${output}/composite_minimal_landscape.png"
          test -s "${output}/continuous_editorial_portrait.png"
          test -s "${output}/continuous_minimal_portrait.png"
          test -s "${output}/semantic_night_microphysics_presentation.png"
          test -s "${output}/semantic_natural_color_presentation.png"
          test -s "${output}/semantic_sst_presentation.png"

      - name: Collect reproducibility manifest
        if: always()
        env:
          ASTRA_VERSION_OVERRIDE: ${{ matrix.astra }}
        run: |
          bash scripts/astra/collect-build-info.sh \
            --build-dir "${GITHUB_WORKSPACE}/build/astra-${{ matrix.astra }}-ci" \
            --output "${GITHUB_WORKSPACE}/build/astra-${{ matrix.astra }}-ci/astra-build-manifest.txt" || true

      - name: Upload visual reference products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-reference-astra-${{ matrix.astra }}
          path: build/astra-${{ matrix.astra }}-ci/presentation-test-output/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astra-${{ matrix.astra }}-build-diagnostics
          path: |
            build/astra-${{ matrix.astra }}-ci/native-build.log
            build/astra-${{ matrix.astra }}-ci/native-version.log
            build/astra-${{ matrix.astra }}-ci/CMakeCache.txt
            build/astra-${{ matrix.astra }}-ci/CMakeFiles/CMakeOutput.log
            build/astra-${{ matrix.astra }}-ci/CMakeFiles/CMakeError.log
            build/astra-${{ matrix.astra }}-ci/astra-build-manifest.txt
          if-no-files-found: ignore
          retention-days: 14

  astra-ubi17:
    name: Official Astra Linux UBI 1.7 smoke build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_astra_ubi17 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside official Astra Linux UBI 1.7
        shell: bash
        run: |
          docker pull registry.astralinux.ru/library/astra/ubi17:1.7.5
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e ASTRA_VERSION_OVERRIDE=1.7 \
            registry.astralinux.ru/library/astra/ubi17:1.7.5 \
            /bin/bash -lc '
              set -Eeuo pipefail
              apt-get update
              bash scripts/astra/install-deps.sh --profile headless --no-update --bootstrap-missing
              bash scripts/astra/build.sh \
                --mode native \
                --profile headless \
                --build-dir /workspace/build/astra-ubi17-ci \
                --prefix /workspace/build/satdump-install-astra-ubi17-ci \
                --jobs 2 \
                --clean-prefix \
                --install
              LD_LIBRARY_PATH=/workspace/build/astra-ubi17-ci:/workspace/build/astra-ubi17-ci/plugins:${LD_LIBRARY_PATH:-} \
                /workspace/build/astra-ubi17-ci/satdump-presentation-semantics-test \
                /workspace/resources/presentation/composite_profiles_ru.json \
                /workspace/resources/fonts/Roboto-Medium.ttf \
                /workspace/build/astra-ubi17-ci/presentation-test-output
              bash scripts/astra/run.sh \
                --prefix /workspace/build/satdump-install-astra-ubi17-ci \
                -- version
            '

      - name: Validate UBI output
        run: |
          test -s build/astra-ubi17-ci/presentation-test-output/continuous_editorial_landscape.png
          test -s build/astra-ubi17-ci/presentation-test-output/continuous_minimal_portrait.png
          test -s build/astra-ubi17-ci/presentation-test-output/semantic_night_microphysics_presentation.png
          test -s build/astra-ubi17-ci/presentation-test-output/semantic_natural_color_presentation.png
          test -s build/astra-ubi17-ci/presentation-test-output/semantic_sst_presentation.png
          test -x build/satdump-install-astra-ubi17-ci/bin/satdump
          test -f build/satdump-install-astra-ubi17-ci/share/satdump/resources/presentation/composite_profiles_ru.json
          test -f build/satdump-install-astra-ubi17-ci/.satdump-install-root

      - name: Upload UBI reference products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-reference-astra-ubi17
          path: build/astra-ubi17-ci/presentation-test-output/*.png
          if-no-files-found: warn
          retention-days: 14
