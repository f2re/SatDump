name: SatDump 1.2.2 Presentation CI

on:
  push:
    branches:
      - release/1.2.2
      - feature/1.2.2-presentation
  pull_request:
    branches:
      - release/1.2.2
  workflow_dispatch:
    inputs:
      run_astra_ubi17:
        description: "Дополнительно проверить официальный Astra Linux UBI 1.7"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: presentation-1.2.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-and-docs:
    name: Astra scripts and documentation
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          find scripts/astra -maxdepth 1 -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          shellcheck \
            --external-sources \
            --exclude=SC1091,SC2034 \
            scripts/astra/*.sh

      - name: Check documentation entry points
        run: |
          test -s README.md
          test -s docs/ru/README.md
          test -s docs/ru/INSTALL_ASTRA.md
          test -s docs/ru/BUILD.md
          test -s docs/ru/RUN.md
          test -s docs/ru/CONFIGURATION.md
          test -s docs/ru/PRESENTATION.md
          test -s docs/ru/PRESENTATION_LAYOUTS.md
          test -s docs/ru/REVIEW_PRESENTATION.md
          test -s docs/ru/ASTRA_VALIDATION.md
          test -s docs/ru/DEPLOYMENT.md
          test -s docs/ru/TROUBLESHOOTING.md

  astra-compatibility:
    name: Astra ${{ matrix.astra }} compatible headless build
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        astra: ["1.6", "1.7"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libfftw3-dev \
            libpng-dev \
            libtiff-dev \
            libjemalloc-dev \
            libcurl4-openssl-dev \
            libnng-dev

          if ! sudo apt-get install -y libvolk2-dev; then
            sudo apt-get install -y libvolk-dev
          fi

      - name: Build Astra-compatible headless profile
        env:
          ASTRA_VERSION_OVERRIDE: ${{ matrix.astra }}
        run: |
          bash scripts/astra/build.sh \
            --profile headless \
            --build-dir "${GITHUB_WORKSPACE}/build/astra-${{ matrix.astra }}-ci" \
            --jobs 2

      - name: Run presentation output integration test
        env:
          BUILD_DIR: ${{ github.workspace }}/build/astra-${{ matrix.astra }}-ci
        run: |
          export LD_LIBRARY_PATH="${BUILD_DIR}:${BUILD_DIR}/plugins:${LD_LIBRARY_PATH:-}"
          "${BUILD_DIR}/satdump-presentation-output-test" \
            resources/fonts/Roboto-Medium.ttf \
            "${BUILD_DIR}/presentation-output-test"

      - name: Validate orientation and visual products
        run: |
          output="build/astra-${{ matrix.astra }}-ci/presentation-test-output"
          integration="build/astra-${{ matrix.astra }}-ci/presentation-output-test"
          test -s "${output}/continuous_editorial_landscape.png"
          test -s "${output}/continuous_minimal_landscape.png"
          test -s "${output}/categorical_editorial_landscape.png"
          test -s "${output}/composite_editorial_landscape.png"
          test -s "${output}/composite_minimal_landscape.png"
          test -s "${output}/continuous_editorial_portrait.png"
          test -s "${output}/continuous_minimal_portrait.png"
          test -s "${integration}/meteor_cloud_rgb_annotated_minimal.png"
          test -s "${integration}/meteor_cloud_rgb_annotated_minimal.json"
          test -s "${integration}/meteor_cloud_rgb_annotated_presentation.png"
          test -s "${integration}/meteor_cloud_rgb_annotated_presentation.json"
          test -s "${integration}/meteor_cloud_rgb_annotated.png"
          test -s "${integration}/meteor_cloud_rgb_annotated.json"

      - name: Collect reproducibility manifest
        if: always()
        env:
          ASTRA_VERSION_OVERRIDE: ${{ matrix.astra }}
        run: |
          bash scripts/astra/collect-build-info.sh \
            --build-dir "${GITHUB_WORKSPACE}/build/astra-${{ matrix.astra }}-ci" \
            --output "${GITHUB_WORKSPACE}/build/astra-${{ matrix.astra }}-ci/astra-build-manifest.txt" || true

      - name: Upload visual reference products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-reference-astra-${{ matrix.astra }}
          path: |
            build/astra-${{ matrix.astra }}-ci/presentation-test-output/*.png
            build/astra-${{ matrix.astra }}-ci/presentation-output-test/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astra-${{ matrix.astra }}-build-diagnostics
          path: |
            build/astra-${{ matrix.astra }}-ci/CMakeCache.txt
            build/astra-${{ matrix.astra }}-ci/CMakeFiles/CMakeOutput.log
            build/astra-${{ matrix.astra }}-ci/CMakeFiles/CMakeError.log
            build/astra-${{ matrix.astra }}-ci/astra-build-manifest.txt
          if-no-files-found: ignore
          retention-days: 14

  astra-ubi17:
    name: Official Astra Linux UBI 1.7 smoke build
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_astra_ubi17) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside official Astra Linux UBI 1.7
        shell: bash
        run: |
          docker pull registry.astralinux.ru/library/astra/ubi17:1.7.5
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e ASTRA_VERSION_OVERRIDE=1.7 \
            registry.astralinux.ru/library/astra/ubi17:1.7.5 \
            /bin/bash -lc '
              set -Eeuo pipefail
              apt-get update
              bash scripts/astra/install-deps.sh --profile headless --no-update --bootstrap-missing
              bash scripts/astra/build.sh \
                --profile headless \
                --build-dir /workspace/build/astra-ubi17-ci \
                --jobs 2
              export LD_LIBRARY_PATH="/workspace/build/astra-ubi17-ci:/workspace/build/astra-ubi17-ci/plugins:${LD_LIBRARY_PATH:-}"
              /workspace/build/astra-ubi17-ci/satdump-presentation-output-test \
                /workspace/resources/fonts/Roboto-Medium.ttf \
                /workspace/build/astra-ubi17-ci/presentation-output-test
            '

      - name: Validate UBI output
        run: |
          test -s build/astra-ubi17-ci/presentation-test-output/continuous_editorial_landscape.png
          test -s build/astra-ubi17-ci/presentation-test-output/continuous_minimal_portrait.png
          test -s build/astra-ubi17-ci/presentation-output-test/meteor_cloud_rgb_annotated_minimal.png
          test -s build/astra-ubi17-ci/presentation-output-test/meteor_cloud_rgb_annotated_presentation.png
          test -s build/astra-ubi17-ci/presentation-output-test/meteor_cloud_rgb_annotated.json

      - name: Upload UBI reference products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-reference-astra-ubi17
          path: |
            build/astra-ubi17-ci/presentation-test-output/*.png
            build/astra-ubi17-ci/presentation-output-test/*
          if-no-files-found: warn
          retention-days: 14
