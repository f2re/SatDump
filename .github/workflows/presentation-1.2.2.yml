name: SatDump 1.2.2 Presentation CI

on:
  push:
    branches:
      - release/1.2.2
      - feature/1.2.2-presentation
  pull_request:
    branches:
      - release/1.2.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-1.2.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-and-docs:
    name: Astra scripts and documentation
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          find scripts/astra -maxdepth 1 -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          shellcheck \
            --external-sources \
            --exclude=SC1091,SC2034 \
            scripts/astra/*.sh

      - name: Check documentation entry points
        run: |
          test -s README.md
          test -s docs/ru/README.md
          test -s docs/ru/INSTALL_ASTRA.md
          test -s docs/ru/BUILD.md
          test -s docs/ru/RUN.md
          test -s docs/ru/CONFIGURATION.md
          test -s docs/ru/PRESENTATION.md
          test -s docs/ru/DEPLOYMENT.md
          test -s docs/ru/TROUBLESHOOTING.md

  linux-core:
    name: Headless build and presentation smoke tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libfftw3-dev \
            libpng-dev \
            libtiff-dev \
            libjemalloc-dev \
            libcurl4-openssl-dev \
            libnng-dev

          if ! sudo apt-get install -y libvolk2-dev; then
            sudo apt-get install -y libvolk-dev
          fi

      - name: Build Astra-compatible headless profile
        env:
          ASTRA_VERSION_OVERRIDE: "1.7"
        run: |
          bash scripts/astra/build.sh \
            --profile headless \
            --build-dir "${GITHUB_WORKSPACE}/build/astra-ci" \
            --jobs 2

      - name: Validate visual products
        run: |
          test -s build/astra-ci/presentation-test-output/continuous.png
          test -s build/astra-ci/presentation-test-output/categorical.png
          test -s build/astra-ci/presentation-test-output/composite.png

      - name: Upload visual test products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-reference-images
          path: build/astra-ci/presentation-test-output/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astra-build-diagnostics
          path: |
            build/astra-ci/CMakeCache.txt
            build/astra-ci/CMakeFiles/CMakeOutput.log
            build/astra-ci/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 14
