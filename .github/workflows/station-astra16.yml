name: Astra 1.6 station - worker, gallery and offline package

on:
  push:
    branches: [release/1.2.2]
    paths:
      - 'station.sh'
      - 'install.sh'
      - 'services/station/**'
      - 'scripts/station/**'
      - 'config/station/**'
      - 'tests/station/**'
      - 'src-cli/**'
      - 'src-core/**'
      - 'plugins/**'
      - 'resources/**'
      - 'pipelines/**'
      - 'satdump_cfg.json'
      - 'CMakeLists.txt'
      - 'scripts/astra/portable/**'
      - 'docs/ru/station/**'
      - '.github/workflows/station-astra16.yml'
  pull_request:
    branches: [release/1.2.2]
  workflow_dispatch:
    inputs:
      build_offline:
        description: 'Собрать полный glibc224-пакет'
        type: boolean
        default: true
      publish:
        description: 'Опубликовать проверенный пакет как prerelease'
        type: boolean
        default: false
      deploy_astra16:
        description: 'Установить по SSH на явно настроенный хост Astra 1.6'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: station-astra16-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  tests:
    name: Queue, image publication, HTTP and installer contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil shellcheck nginx
      - name: Python and browser syntax and contracts
        run: |
          /usr/bin/python3 -m unittest discover -s tests/station -v
          /usr/bin/python3 - <<'PY'
          import ast, pathlib
          for root in ['services/station', 'scripts/station', 'tests/station']:
              for p in pathlib.Path(root).rglob('*.py'):
                  ast.parse(p.read_text(), filename=str(p), feature_version=(3, 5))
          PY
          node --check services/station/web/app.js
      - name: Shell and installer plan
        run: |
          bash -n station.sh
          bash -n install.sh
          for f in scripts/station/*.sh; do bash -n "$f"; done
          shellcheck --severity=error station.sh install.sh scripts/station/*.sh
          ./station.sh help
          ./install.sh --allow-compatible --dry-run

  legacy-runtime:
    name: Real Python 3.5 and Pillow contracts on Stretch
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test legacy runtime before building the compiler
        run: |
          set -Eeuo pipefail
          docker pull debian:stretch-slim
          docker run --rm -v "$GITHUB_WORKSPACE:/source:ro" \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e PYTHONDONTWRITEBYTECODE=1 \
            debian:stretch-slim /bin/bash -ec '
              printf "deb http://archive.debian.org/debian stretch main\n" > /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get install -y --no-install-recommends python3 python3-pil
              cd /source
              python3 --version
              python3 -m unittest discover -s tests/station -v
            '

  package:
    name: Build real SatDump and embedded runtime on glibc 2.24
    needs: [tests, legacy-runtime]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_offline && github.ref == 'refs/heads/release/1.2.2') ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[station-release]') || contains(github.event.head_commit.message, '[station-deploy]')))
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring rsync binutils util-linux xz-utils curl ca-certificates python3
      - uses: actions/cache@v4
        with:
          path: build/station/downloads
          key: station-sources-v1-${{ hashFiles('scripts/astra/portable/lock.env') }}
      - name: Check pinned native component inputs
        id: components
        run: python3 scripts/station/reuse-components.py --select
      - name: Download pinned compiled components
        id: component_download
        if: steps.components.outputs.reuse == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.components.outputs.artifact_name }}
          run-id: ${{ steps.components.outputs.run_id }}
          github-token: ${{ github.token }}
          path: cached-components
      - name: Build and package
        env:
          REUSE_COMPONENTS: ${{ steps.components.outputs.reuse == 'true' && steps.component_download.outcome == 'success' }}
        run: |
          set -o pipefail
          if [[ "$REUSE_COMPONENTS" == true ]]; then
            python3 scripts/station/reuse-components.py --input cached-components --output dist/station 2>&1 | tee station-build.log
          else
            ./station.sh build --jobs 2 2>&1 | tee station-build.log
          fi
      - name: Pull independent runtime test image
        run: docker pull debian:stretch-slim
      - name: Test unpacked payload without network or build dependencies
        run: |
          set -Eeuo pipefail
          mkdir check-package
          archive=$(find dist/station -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          (cd dist/station; sha256sum -c *.tar.gz.sha256)
          tar -xzf "$archive" -C check-package
          bundle=$(find check-package -mindepth 1 -maxdepth 1 -type d -print -quit)
          docker run --rm --network none -v "$(realpath "$bundle"):/opt/station:ro" debian:stretch-slim \
            /bin/bash -ec '
              /opt/station/runtime/python /opt/station/scripts/station/pack.py --verify /opt/station
              /opt/station/engine/satdump version
              /opt/station/runtime/python -m unittest discover -s /opt/station/tests/station -v
              /opt/station/install.sh --allow-compatible --no-start
            '
      - name: Upload binary package
        uses: actions/upload-artifact@v4
        with:
          name: satdump-astra16-station-${{ github.sha }}
          path: |
            dist/station/*.tar.gz
            dist/station/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-build-diagnostics-${{ github.run_id }}
          path: |
            station-build.log
            dist/station/*/PACKAGE-MANIFEST.json
          if-no-files-found: warn

  acceptance:
    name: Real systemd install, WEB, API, nginx and failure rollback
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: satdump-astra16-station-${{ github.sha }}
          path: payload
      - name: Prepare disposable test VM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx python3-pil
          (cd payload; sha256sum -c *.tar.gz.sha256)
          mkdir unpacked
          tar -xzf payload/*.tar.gz -C unpacked
      - name: Install and test the exact packaged payload
        run: |
          set -o pipefail
          bundle=$(find unpacked -mindepth 1 -maxdepth 1 -type d -print -quit)
          # The controller uses host Python; each service uses the bundled runtime.
          sudo env SATDUMP_DISPOSABLE_CI=1 /usr/bin/python3 scripts/station/acceptance.py \
            --package "$(realpath "$bundle")" --output "$GITHUB_WORKSPACE/STATION-ACCEPTANCE.json" 2>&1 | tee station-acceptance.log
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-acceptance-${{ github.sha }}
          path: |
            STATION-ACCEPTANCE.json
            station-acceptance.log
          if-no-files-found: error

  publish:
    name: Publish verified Station BOARD prerelease
    needs: [package, acceptance]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[station-release]'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: satdump-astra16-station-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: station-acceptance-${{ github.sha }}
          path: evidence
      - name: Publish only validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          (cd release; sha256sum -c *.tar.gz.sha256)
          python3 - <<'PY'
          import json, os
          with open('evidence/STATION-ACCEPTANCE.json') as f:
              report = json.load(f)
          assert report['success'] is True
          assert report['package']['git_commit'] == os.environ['GITHUB_SHA']
          PY
          cp evidence/STATION-ACCEPTANCE.json release/
          tag="v1.2.2-astra16-station.${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'EOF'
          # SatDump Station / BOARD для Astra Linux 1.6
          Полный бинарный пакет: движок glibc224, Python/Pillow, интерактивный установщик, обработчик, WEB и защищённый API настроек. Автоматическая публикация PNG/JSON presentation и minimal. Новый дизайн/веб-интерфейс в этот выпуск не входит.

          Проверки: реальный Python 3.5/Pillow; независимый Debian Stretch без сети; установка этого архива на чистой Ubuntu VM с настоящим systemd, запуск WEB/API, PNG+паспорт через очередь, права пользователей, повторная установка, nginx, откат и отказ на занятом порту. Машиночитаемое подтверждение — STATION-ACCEPTANCE.json.

          При неизменных исходных данных сборки движок и runtime могут повторно использоваться из закреплённого SHA-256 артефакта. Их исходная ревизия указана отдельно в component_provenance манифеста; код Station и установщик относятся к ревизии этого выпуска. Все проверки заново выполняются на итоговом архиве.

          Это предварительный инженерный выпуск: приёмка на физической Astra 1.6, мандатные политики, контрольная радиозапись и полная перезагрузка целевой станции не подтверждены. Astra 1.5 этим пакетом не поддерживается. Никакого автоматического развёртывания на пользовательский узел не выполнялось.

          Установка: проверьте файл .sha256, распакуйте архив, запустите sudo ./install.sh. WEB устанавливается автоматически. Руководство: BOARD_INFRASTRUCTURE.ru.md внутри пакета. nginx необязателен и используется только уже установленный; по умолчанию автономный сервер.
          EOF
          printf '\nИсходная ревизия: `%s`. Проверка: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.' >&2
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "SatDump 1.2.2 — Station / BOARD ${GITHUB_RUN_NUMBER}" --notes-file notes.md release/*
          gh release edit "$tag" --draft=false

  deploy:
    name: Explicit SSH deployment to Astra 1.6
    needs: [package, acceptance]
    if: >-
      github.ref == 'refs/heads/release/1.2.2' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_astra16) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[station-deploy]')))
    environment: astra16-station
    runs-on: ${{ fromJSON(vars.ASTRA16_DEPLOY_RUNNERS || '["ubuntu-22.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: satdump-astra16-station-${{ github.sha }}
          path: station-deploy
      - name: Verify and install over authenticated SSH
        env:
          DEPLOY_TARGET: ${{ secrets.ASTRA16_DEPLOY_TARGET }}
          DEPLOY_KEY: ${{ secrets.ASTRA16_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ASTRA16_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_TARGET" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          credentials=$(mktemp -d)
          printf '%s\n' "$KNOWN_HOSTS" > "$credentials/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$credentials/key"
          eval "$(ssh-agent -s)" >/dev/null
          trap 'rm -rf -- "$credentials"; ssh-agent -k >/dev/null' EXIT
          export SSH_KNOWN_HOSTS="$credentials/known_hosts"
          ssh-add "$credentials/key"
          archive=$(find station-deploy -maxdepth 1 -name '*.tar.gz' -print -quit)
          ./station.sh deploy "$archive" "$DEPLOY_TARGET"
