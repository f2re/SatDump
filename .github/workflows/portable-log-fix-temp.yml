name: Temporary portable log fix

on:
  push:
    branches:
      - agent/astra-portable-glibc224

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/astra-portable-glibc224
          fetch-depth: 0

      - name: Redirect internal portable log to stderr
        shell: bash
        run: |
          set -Eeuo pipefail
          file=scripts/astra/portable/inside-chroot.sh
          old='log() { printf '\''[portable] %s\n'\'' "$*"; }'
          new='log() { printf '\''[portable] %s\n'\'' "$*" >&2; }'

          python3 - "${file}" "${old}" "${new}" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one match, got {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          rm .github/workflows/portable-log-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${file}" .github/workflows/portable-log-fix-temp.yml
          git commit -m "Направить portable toolchain log в stderr"
          git push origin HEAD:agent/astra-portable-glibc224
