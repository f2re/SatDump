name: Satellite WEB - contracts, real browser and native Apache
on:
  push:
    branches: [release/1.2.2, integration/orbita-web]
    paths:
      - 'services/station/**'
      - 'scripts/station/**'
      - 'config/station/**'
      - 'tests/station/**'
      - 'tests/browser/**'
      - 'tests/contracts/**'
      - 'station.sh'
      - '.github/workflows/satellite-web.yml'
  pull_request:
    branches: [release/1.2.2]
    paths:
      - 'services/station/**'
      - 'scripts/station/**'
      - 'config/station/**'
      - 'tests/station/**'
      - 'tests/browser/**'
      - 'tests/contracts/**'
      - 'station.sh'
      - '.github/workflows/satellite-web.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: satellite-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dependencies only - never part of the deployed runtime
        run: |
          python -m pip install Pillow==12.3.0 jsonschema==4.26.0 openapi-spec-validator==0.7.2
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
      - name: Station, HTTP, OpenAPI and player regression tests
        run: |
          python -m unittest discover -s tests/station -v
          python -m unittest discover -s tests/contracts -v
          python -m openapi_spec_validator config/station/board-openapi.json
          node --test services/station/web/sat/js/player.test.mjs
          for file in services/station/web/sat/js/*.js; do node --check "$file"; done
          for file in services/station/web/settings/*.js; do node --input-type=module --check < "$file"; done
          python - <<'PY'
          import ast
          from pathlib import Path
          for root in ['services/station','scripts/station','tests/station']:
              for path in Path(root).rglob('*.py'):
                  ast.parse(path.read_text(),filename=str(path),feature_version=(3,5))
          PY
          shellcheck --severity=error station.sh install.sh scripts/station/*.sh
          bash -n station.sh
          ./install.sh --allow-compatible --dry-run --listen 0.0.0.0 --web-server apache2
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [apache2, nginx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: OS server and isolated test browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apache2 nginx
          python -m pip install Pillow==12.3.0 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser -> native proxy -> worker PNG and control API
        run: python tests/browser/satellite_smoke.py --server '${{ matrix.server }}' --artifacts test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: satellite-browser-${{ matrix.server }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
  astra17:
    name: Astra UBI 1.7.5 - OS Python, Pillow and Apache HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native distribution runtime - no pip or replacement libc
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/source:ro" \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e PYTHONDONTWRITEBYTECODE=1 \
            registry.astralinux.ru/library/astra/ubi17:1.7.5 /bin/bash -ec '
              apt-get update -qq
              apt-get install -y --no-install-recommends python3 python3-pil apache2
              cd /source
              python3 --version
              python3 -m unittest discover -s tests/station -v
              python3 tests/browser/satellite_smoke.py --server apache2 --http-only
            '
  source-package:
    name: Verified WEB source component (not a native engine release)
    needs: [contracts, browser, astra17]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package the verified station component without fonts or observation data
        run: |
          mkdir -p web-component
          git archive --format=tar HEAD services/station scripts/station config/station station.sh tests/browser tests/contracts tests/station docs/ru/station/SATELLITE_WEB.md | tar -xf - -C web-component
          test -f web-component/services/station/web/sat/index.html
          test -z "$(find web-component -type f \( -iname '*.ttf' -o -iname '*.woff*' -o -iname '*.otf' \) -print -quit)"
          printf '%s\n' "$GITHUB_SHA" > web-component/REVISION
          tar -czf satdump-web-component.tar.gz -C web-component .
          sha256sum satdump-web-component.tar.gz > satdump-web-component.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: satdump-web-component-${{ github.sha }}
          path: satdump-web-component.*
          if-no-files-found: error
          retention-days: 30
