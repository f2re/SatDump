name: Temporary finalize Astra integration

# Одноразовый workflow. После успешного исправления удаляет собственный файл.
on:
  push:
    branches:
      - agent/astra-portable-glibc224

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/astra-portable-glibc224
          fetch-depth: 0

      - name: Restore stable 1.2.2 APIs and localize presentation compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          # Не расширяем публичный image I/O API и TLE serializer ради одного
          # presentation call-site: это ломает Lua function-pointer binding.
          git checkout origin/release/1.2.2 -- \
            src-core/common/image/io.h \
            src-core/common/tracking/tle.h

          python3 <<'PY'
          from pathlib import Path

          path = Path("src-core/products/processor/presentation_outputs.cpp")
          text = path.read_text(encoding="utf-8")

          old_tle = '''                    if (products.has_tle())
                        config["metadata"]["tle"] = products.get_tle();'''
          new_tle = '''                    if (products.has_tle())
                    {
                        const satdump::TLE tle = products.get_tle();
                        config["metadata"]["tle"] = {
                            {"norad", tle.norad},
                            {"name", tle.name},
                            {"line1", tle.line1},
                            {"line2", tle.line2}};
                    }'''
          if text.count(old_tle) != 1:
              raise SystemExit(f"Expected one TLE assignment, got {text.count(old_tle)}")
          text = text.replace(old_tle, new_tle, 1)

          legacy_marker = "            bool save_legacy("
          marker_index = text.find(legacy_marker)
          if marker_index < 0:
              raise SystemExit("save_legacy marker not found")

          prefix = text[:marker_index]
          suffix = text[marker_index:]
          old_save = "                    image::save_img(rendered, path);"
          new_save = '''                    image::Image writable_rendered = rendered;
                    image::save_img(writable_rendered, path);'''
          if suffix.count(old_save) != 1:
              raise SystemExit(f"Expected one const save in save_legacy, got {suffix.count(old_save)}")
          suffix = suffix.replace(old_save, new_save, 1)
          path.write_text(prefix + suffix, encoding="utf-8")
          PY

          rm .github/workflows/finalize-astra-integration-temp.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-core/common/image/io.h \
            src-core/common/tracking/tle.h \
            src-core/products/processor/presentation_outputs.cpp \
            .github/workflows/finalize-astra-integration-temp.yml
          git commit -m "Локализовать совместимость presentation с API 1.2.2"
          git push origin HEAD:agent/astra-portable-glibc224
