name: Temporary one-shot source fix

on:
  push:
    branches:
      - agent/astra-portable-glibc224

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/astra-portable-glibc224
          fetch-depth: 0

      - name: Apply exact type fix and remove this workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          file=src-core/common/image/presentation.cpp
          old='const int description_width = std::max(1, output.width() - style.padding - description_x);'
          new='const int description_width = std::max(1, (int)output.width() - style.padding - description_x);'

          grep -Fq "${old}" "${file}"
          python3 - "${file}" "${old}" "${new}" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one match, got {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          rm .github/workflows/source-export-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${file}" .github/workflows/source-export-temp.yml
          git commit -m "Исправить тип ширины RGB-легенды"
          git push origin HEAD:agent/astra-portable-glibc224
