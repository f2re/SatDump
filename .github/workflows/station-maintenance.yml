name: Station installer maintenance - immutable components and full acceptance

on:
  pull_request:
    branches: [release/1.2.2]
    paths:
      - 'scripts/station/install.sh'
      - 'scripts/station/maintenance.py'
      - 'tests/station/test_install_permissions.py'
      - 'tests/station/test_maintenance.py'
      - '.github/workflows/station-maintenance.yml'
  push:
    branches: [release/1.2.2]
    paths:
      - 'scripts/station/install.sh'
      - 'scripts/station/maintenance.py'
      - 'tests/station/test_install_permissions.py'
      - 'tests/station/test_maintenance.py'
      - '.github/workflows/station-maintenance.yml'

permissions:
  contents: read
  actions: read
concurrency:
  group: station-maintenance-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: d7eff18016debaeb5719161d89b218fbbae4b1c7
  SOURCE_RUN: '34349962244'

jobs:
  package-accept:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[station-maintenance-release]')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil nginx shellcheck
      - name: Contracts and actual unprivileged process startup
        run: |
          /usr/bin/python3 -m unittest discover -s tests/station -v
          sudo /usr/bin/python3 -m unittest discover -s tests/station -p test_install_permissions.py -v
          bash -n scripts/station/install.sh
          shellcheck --severity=error scripts/station/install.sh
      - name: Verify provenance of the original native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > source-jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          jobs = json.load(open('source-jobs.json'))['jobs']
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['head_branch'] == 'release/1.2.2' and run['event'] == 'push'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/station-astra16.yml'
          job = next(j for j in jobs if j['name'] == 'Build real SatDump and embedded runtime on glibc 2.24')
          assert job['conclusion'] == 'success'
          steps = {s['name']: s['conclusion'] for s in job['steps']}
          assert steps['Build and package'] == 'success'
          assert steps['Test unpacked payload without network or build dependencies'] == 'success'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: satdump-astra16-station-${{ env.SOURCE_SHA }}
          path: upstream
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Repackage only reviewed installer changes
        run: |
          set -Eeuo pipefail
          (cd upstream; sha256sum -c *.tar.gz.sha256)
          archives=(upstream/*.tar.gz)
          test ${#archives[@]} = 1 && test -f "${archives[0]}"
          /usr/bin/python3 scripts/station/maintenance.py --archive "${archives[0]}" \
            --source-sha "$SOURCE_SHA" --source-run "$SOURCE_RUN" --output dist/station-maintenance
      - name: Validate the new archive with its real Python 3.5 without network
        run: |
          set -Eeuo pipefail
          docker pull debian:stretch-slim
          mkdir clean-package
          tar -xzf dist/station-maintenance/*.tar.gz -C clean-package
          bundle=$(find clean-package -mindepth 1 -maxdepth 1 -type d -print -quit)
          docker run --rm --network none -v "$(realpath "$bundle"):/opt/station:ro" debian:stretch-slim \
            /bin/bash -ec '
              /opt/station/runtime/python /opt/station/scripts/station/pack.py --verify /opt/station
              /opt/station/engine/satdump version
              /opt/station/runtime/python -m unittest discover -s /opt/station/tests/station -v
              /opt/station/install.sh --allow-compatible --no-start --yes
            '
      - name: Full systemd installation acceptance of this new archive
        run: |
          set -o pipefail
          bundle=$(find clean-package -mindepth 1 -maxdepth 1 -type d -print -quit)
          sudo env SATDUMP_DISPOSABLE_CI=1 /usr/bin/python3 scripts/station/acceptance.py \
            --package "$(realpath "$bundle")" --output "$GITHUB_WORKSPACE/STATION-ACCEPTANCE.json" \
            2>&1 | tee station-maintenance-acceptance.log
      - name: Stage only a successfully accepted package
        run: |
          python3 - <<'PY'
          import json, os
          report = json.load(open('STATION-ACCEPTANCE.json'))
          assert report['success'] is True
          assert report['package']['git_commit'] == os.environ['GITHUB_SHA']
          assert report['package']['maintenance']['native_components_unchanged'] is True
          PY
          mkdir release-payload
          cp dist/station-maintenance/*.tar.gz dist/station-maintenance/*.sha256 \
            dist/station-maintenance/STATION-BUILD-PROVENANCE.json STATION-ACCEPTANCE.json release-payload/
      - uses: actions/upload-artifact@v4
        with:
          name: satdump-maintenance-${{ github.sha }}
          path: release-payload/*
          if-no-files-found: error
      - name: Preserve acceptance evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-maintenance-evidence-${{ github.sha }}
          path: |
            STATION-ACCEPTANCE.json
            station-maintenance-acceptance.log
            source-run.json
            source-jobs.json
          if-no-files-found: warn

  publish:
    needs: package-accept
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/1.2.2' && contains(github.event.head_commit.message, '[station-maintenance-release]')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: satdump-maintenance-${{ github.sha }}
          path: release
      - name: Publish the accepted artifact without rebuilding or replacing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          (cd release; sha256sum -c *.tar.gz.sha256)
          python3 - <<'PY'
          import glob, hashlib, json, os
          report = json.load(open('release/STATION-ACCEPTANCE.json'))
          provenance = json.load(open('release/STATION-BUILD-PROVENANCE.json'))
          assert report['success'] is True and report['package']['git_commit'] == os.environ['GITHUB_SHA']
          assert provenance['package_git_commit'] == os.environ['GITHUB_SHA']
          assert provenance['source_git_commit'] == os.environ['SOURCE_SHA']
          assert provenance['native_components_unchanged'] is True
          archive, = glob.glob('release/*.tar.gz')
          with open(archive, 'rb') as f:
              assert hashlib.sha256(f.read()).hexdigest() == provenance['archive_sha256']
          PY
          tag="v1.2.2-astra16-station.20260909.${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'EOF'
          # SatDump 1.2.2 — Station / BOARD
          Полный автономный пакет для Astra 1.6 x86_64: SatDump, отдельный Python/Pillow, цветной интерактивный установщик, обработчик, WEB, локальный авторизованный API, публикация presentation/minimal PNG и JSON. Новый интерфейс и оформление BOARD не включены.

          Исправлены установка из закрытого каталога загрузок и первый непривилегированный запуск nginx. nginx необязателен: автономный WEB устанавливается автоматически; пакеты ОС и системные библиотеки не меняются.

          Проверено: модульные тесты, фактический непривилегированный запуск nginx, новый архив с Python 3.5 без сети, установка с настоящим systemd на одноразовой Ubuntu VM, WEB/API, изображения и паспорта, права пользователей, повторная установка, nginx, откат, занятый порт и возобновление работы.

          Это инженерный предварительный выпуск. Приёмка на физической Astra 1.6, её мандатные политики, контрольная радиозапись и перезагрузка целевого оборудования не подтверждены. Astra 1.5 не поддерживается этим пакетом. На пользовательский узел ничего не развёртывалось.

          Нативные компоненты взяты без изменения байтов, режимов и ссылок из успешной полной сборки d7eff18016debaeb5719161d89b218fbbae4b1c7 (run 34349962244). Между исходной и новой ревизиями разрешены только перечисленные исправления установщика, тесты и релизная инфраструктура; изменения ядра, runtime-сборщика и scientific-кода запрещены. Происхождение сохранено внутри PACKAGE-MANIFEST.json и в STATION-BUILD-PROVENANCE.json. Новый архив заново прошёл установочную приёмку; неуспешная приёмка предыдущего пакета не выдаётся за успешную.

          Установка: проверить .sha256, распаковать tar.gz, выполнить sudo ./install.sh. Готовность WEB проверяется автоматически. Инструкция внутри архива: docs/ru/station/BOARD_INFRASTRUCTURE.md.
          EOF
          printf '\nРевизия пакета: `%s`. Проверка выпуска: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.' >&2
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'SatDump 1.2.2 — Station / BOARD' --notes-file notes.md release/*
          gh release edit "$tag" --draft=false
