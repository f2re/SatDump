name: Natural Earth Russian city names
on:
  push:
    branches: ['release/1.2.2']
    paths:
      - 'scripts/maps/**'
      - 'tests/maps/**'
      - 'src-core/common/map/city_labels.cpp'
      - 'src-core/common/map/city_name_resolver.h'
      - '.github/workflows/city-names-ru.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: city-names-ru-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.repository == 'f2re/SatDump' && github.ref == 'refs/heads/release/1.2.2'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Unit tests
        run: python3 -m unittest discover -s tests/maps -v
      - name: Compile resolver and check rendering translation unit
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc-core tests/maps/test_city_name_resolver.cpp -o /tmp/test-city-names
          /tmp/test-city-names
          g++ -std=c++17 -fsyntax-only -Isrc-core src-core/common/map/city_labels.cpp
      - name: Fetch pinned source once
        run: |
          mkdir -p city-names-audit
          SOURCE_URL=$(python3 -c "import runpy; print(runpy.run_path('scripts/maps/sync_city_names_ru.py')['SOURCE_URL'])")
          curl --fail --location --retry 3 "$SOURCE_URL" -o city-names-audit/source.json
      - name: Synchronize and verify exact identity and idempotence
        run: |
          python3 scripts/maps/sync_city_names_ru.py --source city-names-audit/source.json
          python3 scripts/maps/sync_city_names_ru.py --source city-names-audit/source.json --check
          cp resources/maps/ne_10m_populated_places_simple.json /tmp/cities-first.json
          cp resources/maps/city_names_ru.report.json /tmp/report-first.json
          python3 scripts/maps/sync_city_names_ru.py --source city-names-audit/source.json
          cmp /tmp/cities-first.json resources/maps/ne_10m_populated_places_simple.json
          cmp /tmp/report-first.json resources/maps/city_names_ru.report.json
          /tmp/test-city-names resources/maps/ne_10m_populated_places_simple.json
          git diff --check
      - name: Commit only verified data to the same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/maps/ne_10m_populated_places_simple.json resources/maps/city_names_ru.report.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(maps): import 6209 verbatim Russian names from pinned Natural Earth'
            git push origin HEAD:release/1.2.2
          fi
      - name: Collect audit result
        if: always()
        run: |
          mkdir -p city-names-audit
          cp resources/maps/ne_10m_populated_places_simple.json city-names-audit/target.json
          if test -f resources/maps/city_names_ru.report.json; then
            cp resources/maps/city_names_ru.report.json city-names-audit/report.json
          fi
      - name: Save data and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-names-ru
          path: city-names-audit/
          retention-days: 14
